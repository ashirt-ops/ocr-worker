name: ci

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Runs every day at 00:00 UTC

jobs:
  gotest:
    name: Test ocr worker
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt update && sudo apt install -y libtesseract-dev tesseract-ocr-eng

      - name: Build
        run: go build -v ./...

      - name: gofmt
        run: |
          GOFMTOUT=$(gofmt -l .)
          if [[ ! -z "${GOFMTOUT}" ]]; then
            echo "FATAL: gofmt violation(s), please fix"
            echo $GOFMTOUT
            exit -1
          fi
      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

  build_push:
    name: Build and Push
    needs: [gotest]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ashirt/ocr-worker
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=false
      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push PR
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: false # Push with pr-### and sha-xxxxxxx tags

      - name: Build and Push Latest
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.docker_meta.outputs.tags }}, ashirt/ocr-worker:latest #Add latest tag for main
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: true
